<dialog class="art-lightbox" aria-label="查看艺术作品">
  <div class="art-lightbox__frame">
    <button class="art-lightbox__close" type="button" aria-label="关闭图片">×</button>
    <img class="art-lightbox__image" alt="">
    <div class="art-lightbox__footer">
      <button class="art-lightbox__prev" type="button" aria-label="上一张">←</button>
      <span class="art-lightbox__caption" aria-live="polite"></span>
      <button class="art-lightbox__next" type="button" aria-label="下一张">→</button>
    </div>
  </div>
</dialog>
